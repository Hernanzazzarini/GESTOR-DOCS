<!-- Menú lateral -->
<aside class="sidebar" [class.colapsada]="colapsado" [class.abierta]="abierto" aria-label="Menú principal">
  <div class="marca">
    <span class="marca-logo" aria-hidden="true">📂</span>
    <span class="marca-texto">
      <b>Gestor</b>
      <small>de documentación</small>
    </span>
    <button
      type="button"
      class="colapsar"
      (click)="alternarColapso()"
      [attr.aria-label]="colapsado ? 'Agrandar el menú' : 'Achicar el menú'"
      [attr.title]="colapsado ? 'Agrandar el menú' : 'Achicar el menú'"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" /></svg>
    </button>
    <button type="button" class="cerrar-menu" (click)="abierto = false" aria-label="Cerrar menú">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
    </button>
  </div>

  <nav class="menu">
    <span class="menu-titulo">Menú</span>
    @for (e of enlaces; track e.ruta) {
      <a
        class="item"
        [routerLink]="e.ruta"
        routerLinkActive="activo"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: e.ruta === '/' }"
        [attr.title]="colapsado ? e.texto : null"
      >
        <span class="item-icono" aria-hidden="true">{{ e.icono }}</span>
        <span class="item-texto">{{ e.texto }}</span>
      </a>
    }
  </nav>

  <div class="pie">
    @if (email) {
      <div class="usuario" [attr.title]="email">
        <span class="avatar" aria-hidden="true">{{ inicial }}</span>
        <span class="usuario-datos">
          <span class="usuario-mail">{{ email }}</span>
          @if (textoRol) {
            <span class="rol">{{ textoRol }}</span>
          }
        </span>
      </div>
    }
    <button type="button" class="item item-salir" (click)="logout()" [attr.title]="colapsado ? 'Cerrar sesión' : null">
      <span class="item-icono" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11" /></svg>
      </span>
      <span class="item-texto">Cerrar sesión</span>
    </button>
  </div>
</aside>

<!-- Fondo oscuro detrás del menú abierto (celular) -->
@if (abierto) {
  <div class="fondo" (click)="abierto = false" aria-hidden="true"></div>
}

<!-- Barra de arriba: título de la pantalla -->
<header class="barra">
  <button type="button" class="hamburguesa" (click)="abierto = true" aria-label="Abrir menú">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
  </button>
  <h1>{{ titulo }}</h1>
  <span class="fecha">{{ hoy }}</span>
</header>
